# Separate staging Blueprint. Import manually only after reviewing the generated
# service URLs and entering dedicated staging-only credentials.
# NEVER copy production database, JWT, Redis, Cloudinary, OAuth, or SMTP secrets.
services:
  - type: web
    name: devlog-staging-api-c6u8
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: UPLOAD_DIR
        value: /tmp/devlog-staging-uploads
      - key: STAGING_MODE
        value: "true"
      - key: STAGING_DB_NAME
        sync: false
      - key: STAGING_MONGODB_HOST
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: COOKIE_SECRET
        sync: false
      - key: CLIENT_URL
        value: https://devlog-staging-client-c6u8.onrender.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: REDIS_URL
        sync: false

  - type: web
    name: devlog-staging-client-c6u8
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # This target is staging-only. If Render assigns a different API hostname,
      # update this destination before deploying the static site.
      - type: rewrite
        source: /api/*
        destination: https://devlog-staging-api-c6u8.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_URL
        value: /api/v1
      - key: VITE_SOCKET_URL
        value: https://devlog-staging-api.onrender.com
