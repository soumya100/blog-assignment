name: Authenticated staging Playwright

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devlog-staging-playwright
  cancel-in-progress: false

jobs:
  authenticated-e2e:
    name: Authenticated browser checks against staging only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Require staging URL and dedicated synthetic test account
        env:
          STAGING_FRONTEND_URL: ${{ vars.STAGING_FRONTEND_URL }}
          STAGING_E2E_EMAIL: ${{ secrets.STAGING_E2E_EMAIL }}
          STAGING_E2E_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
        run: |
          test -n "$STAGING_FRONTEND_URL" || { echo "Missing staging environment variable STAGING_FRONTEND_URL"; exit 1; }
          test -n "$STAGING_E2E_EMAIL" || { echo "Missing staging secret STAGING_E2E_EMAIL"; exit 1; }
          test -n "$STAGING_E2E_PASSWORD" || { echo "Missing staging secret STAGING_E2E_PASSWORD"; exit 1; }
          node -e "const u=new URL(process.env.STAGING_FRONTEND_URL); if(u.protocol!=='https:' || !u.hostname.startsWith('devlog-staging-') || !u.hostname.endsWith('.onrender.com') || u.hostname==='devlog-client-rq1y.onrender.com') process.exit(1)"
      - name: Install frontend and browser test dependencies
        working-directory: client
        run: |
          npm install
          npm install --no-save --package-lock=false @playwright/test @axe-core/playwright
          npx playwright install --with-deps chromium
      - name: Run public and authenticated browser checks
        working-directory: client
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.STAGING_FRONTEND_URL }}
          STAGING_E2E_EMAIL: ${{ secrets.STAGING_E2E_EMAIL }}
          STAGING_E2E_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
          CI: "true"
        run: npx playwright test --config=playwright.config.js e2e/quality.spec.js e2e/staging-auth.spec.js
