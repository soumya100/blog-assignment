name: Deployed smoke and passive DAST

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: deployed-security-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Live deployment availability smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check deployed frontend routes and direct backend API health
        env:
          SMOKE_BASE_URL: https://devlog-client-rq1y.onrender.com
          SMOKE_API_BASE_URL: https://blog-assignment-ds1d.onrender.com
        run: node qa/smoke/deployed-smoke.mjs

  zap-baseline:
    name: OWASP ZAP passive baseline scan
    runs-on: ubuntu-latest
    needs: smoke
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Run passive ZAP baseline against the authorized deployment
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: https://devlog-client-rq1y.onrender.com
          cmd_options: "-m 3"
          fail_action: false
          allow_issue_writing: false
      - name: Upload ZAP baseline report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-baseline-report
          path: |
            report_html.html
            report_md.md
            report_json.json
          if-no-files-found: warn
          retention-days: 30
