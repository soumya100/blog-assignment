name: CI

on:
  push:
    branches:
      - feat/publishing-experience
      - feat/seo-rss-publishing-controls
      - feat/platform-feature-completion
  pull_request:
    branches:
      - main
      - feat/platform-reader-dashboard
      - feat/platform-completion-publishing-community
      - feat/seo-rss-publishing-controls
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend regression tests and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run frontend regression tests
        run: npm test
      - name: Build frontend
        run: npm run build

  backend:
    name: Backend regression and security tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run backend unit, integration, smoke and security tests
        run: npm test

  browser-quality:
    name: Browser smoke and WCAG accessibility
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install locked application dependencies
        run: npm ci
      - name: Install browser test tooling without changing project manifests
        run: npm install --no-save --no-package-lock @playwright/test @axe-core/playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build frontend for production smoke tests
        run: npm run build
      - name: Run browser smoke and accessibility tests
        run: npx playwright test --config=playwright.config.js

  security:
    name: Dependency and secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit frontend production dependencies
        run: npm audit --prefix client --omit=dev --audit-level=high
      # Vite/Vitest currently resolve picomatch 4.0.7, which is flagged by
      # GHSA-fc5q-39xc-vjpf. No upstream fixed npm release is available yet;
      # keep the full dev-tooling audit visible without blocking production
      # dependency verification. Re-enable as a required check once upstream
      # publishes a patched release and the lockfile can be updated.
      - name: Report frontend development dependency advisories
        run: npm audit --prefix client --audit-level=high
        continue-on-error: true
      - name: Audit backend production dependencies
        run: npm audit --prefix server --omit=dev --audit-level=high
      - name: Report backend development dependency advisories
        run: npm audit --prefix server --audit-level=high
        continue-on-error: true
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
