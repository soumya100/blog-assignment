name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend unit and regression tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        name: Install locked dependencies
      - run: npm test
        name: Run Vitest component and regression suite
      - run: npm run build
        name: Build production bundle

  backend:
    name: Backend unit, integration, API and security tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  browser-quality:
    name: Browser E2E smoke and accessibility
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Install browser test tooling without changing manifests
        run: npm install --no-save --no-package-lock @playwright/test @axe-core/playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build frontend for production-browser tests
        run: npm run build
      - name: Run Playwright smoke and axe accessibility suite
        run: npx playwright test --config=playwright.config.js
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            client/test-results
            client/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  security:
    name: Dependency and secret security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch pull request base history for secret scanning
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"
          git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"
          git cat-file -e "${{ github.event.pull_request.base.sha }}^"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit frontend production dependencies
        run: npm audit --prefix client --omit=dev --audit-level=high
      - name: Report frontend development dependency advisories
        run: npm audit --prefix client --audit-level=high
        continue-on-error: true
      - name: Audit backend production dependencies
        run: npm audit --prefix server --omit=dev --audit-level=high
      - name: Report backend development dependency advisories
        run: npm audit --prefix server --audit-level=high
        continue-on-error: true
      - name: Scan repository history for exposed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review and lockfile integrity
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request'
      - name: Review pull request dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
      - name: Validate frontend and backend lockfiles on branch pushes
        if: github.event_name != 'pull_request'
        run: |
          (cd client && npm ci --ignore-scripts)
          (cd server && npm ci --ignore-scripts)
          echo "Both committed lockfiles install cleanly. Pull-request dependency comparison runs in the PR event."
