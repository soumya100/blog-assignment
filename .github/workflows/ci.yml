name: CI

on:
  push:
    branches:
      - feat/publishing-experience
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend regression tests and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run frontend regression tests
        run: npm test
      - name: Build frontend
        run: npm run build

  backend:
    name: Backend regression and security tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run backend unit, integration, smoke and security tests
        run: npm test

  browser-quality:
    name: Browser smoke and WCAG accessibility
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install locked application dependencies
        run: npm ci
      - name: Install browser test tooling without changing project manifests
        run: npm install --no-save --no-package-lock @playwright/test @axe-core/playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build frontend for production smoke tests
        run: npm run build
      - name: Run browser smoke and accessibility tests
        run: npx playwright test --config=playwright.config.js

  security:
    name: Dependency and secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit frontend dependencies
        run: npm audit --prefix client --audit-level=high
      - name: Audit backend dependencies
        run: npm audit --prefix server --audit-level=high
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
