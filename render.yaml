# Render.com Infrastructure as Code Blueprint
# Docs: https://render.com/docs/yaml-spec

services:
  # ─────────────────────────────────────────────────────────────
  # 1. Backend Web Service (Node.js / Express / Socket.io)
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: devlog-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      # Set these in the Render Dashboard under Environment:
      # MONGODB_URI: (MongoDB Atlas Connection URI)
      # JWT_ACCESS_SECRET: (Min 32 characters)
      # JWT_REFRESH_SECRET: (Min 32 characters)
      # COOKIE_SECRET: (Min 32 characters)
      # CLIENT_URL: https://<frontend-subdomain>.onrender.com
      # ADMIN_EMAIL: admin@blogplatform.dev
      # ADMIN_PASSWORD: (Your secure admin password)

  # ─────────────────────────────────────────────────────────────
  # 2. Frontend Static Site (React / Vite SPA)
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: devlog-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # Reverse proxy /api calls to backend to make cookies 100% first-party (bypasses 3P cookie blocks)
      # Replace <backend-subdomain> with your actual devlog-api subdomain
      - type: rewrite
        source: /api/*
        destination: https://blog-assignment-ds1d.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 18
      # Set these in the Render Dashboard under Environment:
      # VITE_API_URL: https://<backend-subdomain>.onrender.com/api/v1
      # VITE_SOCKET_URL: https://<backend-subdomain>.onrender.com
