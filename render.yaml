# Render.com Infrastructure as Code Blueprint
# Docs: https://render.com/docs/yaml-spec

services:
  # ─────────────────────────────────────────────────────────────
  # 1. Backend Web Service (Node.js / Express / Socket.io)
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: devlog-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      # Set these in the Render Dashboard under Environment:
      # CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET
      # MONGODB_URI: MongoDB Atlas Connection URI
      # JWT_ACCESS_SECRET, JWT_REFRESH_SECRET, COOKIE_SECRET: independent secrets (32+ chars)
      # CLIENT_URL: https://<frontend-subdomain>.onrender.com
      # ADMIN_EMAIL / ADMIN_PASSWORD: only if explicitly required for provisioning
      # Google OAuth: GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_CALLBACK_URL
      # Facebook OAuth: FACEBOOK_APP_ID / FACEBOOK_CLIENT_ID,
      # FACEBOOK_APP_SECRET / FACEBOOK_CLIENT_SECRET, FACEBOOK_CALLBACK_URL

  # ─────────────────────────────────────────────────────────────
  # 2. Frontend Static Site (React / Vite SPA)
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: devlog-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # Reverse proxy /api calls to backend to make cookies first-party.
      - type: rewrite
        source: /api/*
        destination: https://blog-assignment-ds1d.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    # Static sites do not run Express/Helmet. Set response headers at the CDN.
    # Keep CSP aligned with the app's same-origin bundles, Google Fonts, Cloudinary,
    # API and Socket.IO endpoints. Re-test browser flows after every CSP change.
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; upgrade-insecure-requests"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains"
      - path: /*
        name: Cache-Control
        value: "no-cache, must-revalidate"
    envVars:
      - key: NODE_VERSION
        value: 20
      # VITE_API_URL: /api/v1 (same-origin; uses the /api proxy above)
      # VITE_SOCKET_URL: https://blog-assignment-ds1d.onrender.com
